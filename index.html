<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🧠 Cérebro Central</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100vh;display:flex;flex-direction:column}header{padding:18px 20px;border-bottom:1px solid #252936;background:#11141b}h1{margin:0;font-size:20px}p{margin:5px 0 0;color:#8e96a8;font-size:13px}#chat{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}.msg{max-width:85%;padding:12px 15px;border-radius:16px;line-height:1.45;white-space:pre-wrap}.user{align-self:flex-end;background:#2563eb}.bot{align-self:flex-start;background:#191d27;border:1px solid #292e3a}form{display:flex;gap:8px;padding:12px;border-top:1px solid #252936;background:#11141b}textarea{flex:1;resize:none;border:1px solid #303646;background:#191d27;color:white;border-radius:14px;padding:12px;font:inherit;min-height:48px;max-height:120px;outline:none}button{border:0;border-radius:14px;padding:0 18px;background:#2563eb;color:white;font-weight:700}button:disabled{opacity:.5}</style></head><body><header><h1>🧠 Cérebro Central</h1><p>Ecossistema Multi-IA · memória compartilhada</p></header><main id="chat"><div class="msg bot">Fala, mano. O Cérebro Central está online. 🚀</div></main><form id="form"><textarea id="input" placeholder="Digite sua mensagem..."></textarea><button id="send">Enviar</button></form><script>const API="https://xtnfzejcrzloxubfykcg.supabase.co/functions/v1/chat-app",chat=document.getElementById("chat"),form=document.getElementById("form"),input=document.getElementById("input"),send=document.getElementById("send");function add(t,c){const e=document.createElement("div");e.className="msg "+c;e.textContent=t;chat.appendChild(e);chat.scrollTop=chat.scrollHeight;return e}form.addEventListener("submit",async e=>{e.preventDefault();const m=input.value.trim();if(!m)return;add(m,"user");input.value="";send.disabled=true;const l=add("Pensando...","bot");try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:m})}),d=await r.json();l.remove();if(!r.ok||!d.ok)add("Deu um erro: "+(d.error||"resposta inválida"),"bot");else add(d.reply||d.message||"Sem resposta.","bot")}catch(x){l.remove();add("Não consegui conectar ao Cérebro Central.","bot")}finally{send.disabled=false;input.focus()}});input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});</script></body></html>
